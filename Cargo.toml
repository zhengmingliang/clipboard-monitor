[package]
name = "clipboard-monitor"
version = "1.0.0"
edition = "2021"
description = "跨 Windows、macOS、Linux 的本机剪贴板变化监控"
license = "MIT"
publish = false

[[bin]]
name = "clipboard-monitor"
path = "src/main.rs"

[dependencies]
aes-gcm = "0.10.3"
anyhow = "1.0.104"
arboard = "3.7.0"
base64 = "0.22.1"
hex = "0.4.3"
zeroize = "1.8.2"
ctrlc = { version = "3.5.2", features = ["termination"] }
fs2 = "0.4.3"
percent-encoding = "2.3.2"
rusqlite = { version = "0.32.1", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.10.9"

[target.'cfg(unix)'.dependencies]
libc = "0.2.191"

[target.'cfg(target_os = "linux")'.dependencies]
x11rb = { version = "0.13.2", features = ["extra-traits", "xfixes", "record", "res"] }
wayland-client = "0.31.15"
wayland-protocols = { version = "0.32.13", features = ["client", "staging"] }


[target.'cfg(target_os = "windows")'.dependencies]
time = { version = "0.3.44", features = ["local-offset"] }
# arboard 的 Windows 传递依赖，显式引用其变更序号/格式枚举/所有者查询。
clipboard-win = "5.4.3"
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_Security_Cryptography",
    "Win32_System_DataExchange",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "macos")'.dependencies]
# changeCount / types / frontmostApplication：正常窗口会话里的快速路径。
objc2 = "0.6.5"
objc2-app-kit = "0.3.2"
objc2-foundation = "0.3.2"

[dev-dependencies]
serde_json = "1.0.154"

[target.'cfg(target_os = "linux")'.dev-dependencies]
x11rb = { version = "0.13.2", features = ["extra-traits"] }
# 仅用于 Wayland 端到端测试里的进程内最小 compositor（发布包不含）。
wayland-server = "0.31.14"
wayland-protocols = { version = "0.32.13", features = ["server", "staging"] }

[profile.release]
lto = "thin"
codegen-units = 1
opt-level = 3
strip = true
panic = "unwind"
