[package]
name = "clipboard-monitor"
version = "1.0.0"
edition = "2021"
description = "跨 Windows、macOS、Linux 的本机剪贴板变化监控"
license = "MIT"
publish = false

[[bin]]
name = "clipboard-monitor"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
arboard = "3.7.0"
ctrlc = { version = "3.5.2", features = ["termination"] }
fs2 = "0.4.3"
percent-encoding = "2.3.2"
png = "0.18.1"
rusqlite = { version = "0.32.1", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.10.9"

[target.'cfg(unix)'.dependencies]
libc = "0.2.191"

[target.'cfg(target_os = "linux")'.dependencies]
x11rb = { version = "0.13.2", features = ["extra-traits", "xfixes", "record", "res"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSPasteboard"] }

[target.'cfg(target_os = "windows")'.dependencies]
time = { version = "0.3.44", features = ["local-offset"] }
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_DataExchange",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
serde_json = "1.0.154"

[target.'cfg(target_os = "linux")'.dev-dependencies]
x11rb = { version = "0.13.2", features = ["extra-traits"] }

[profile.release]
lto = "thin"
codegen-units = 1
opt-level = 3
strip = true
panic = "unwind"
