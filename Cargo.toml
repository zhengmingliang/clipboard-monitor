[package]
name = "clipboard-monitor"
version = "1.0.0"
edition = "2021"
description = "本机 X11 剪贴板读写监控"
license = "MIT"
publish = false

[[bin]]
name = "clipboard-monitor"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
libc = "0.2.191"
percent-encoding = "2.3.2"
rusqlite = { version = "0.32.1", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.10.9"
x11rb = { version = "0.13.2", features = ["extra-traits", "xfixes", "record", "res"] }

[dev-dependencies]
serde_json = "1.0.154"
x11rb = { version = "0.13.2", features = ["extra-traits"] }

[profile.release]
lto = "thin"
codegen-units = 1
opt-level = 3
strip = true
panic = "unwind"
